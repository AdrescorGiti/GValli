[package]
name = "gvalli"
version = "0.7.2"
edition = "2021"
description = "Ultra-fast interactive CLI aggregator & Native Package Manager for G OS"
license = "MIT"
authors = ["Giti Adrescor"]

[[bin]]
name = "gvalli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.27"
ratatui = "0.26"
flate2 = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
tokio = { version = "1.37", features = ["full"] }
toml = "0.8"
walkdir = "2.5"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true