[package]
name = "gvalli"
version = "0.4.1"
edition = "2021"
description = "Ультрабыстрый интерактивный CLI-агрегатор: AUR, Pacman, Flatpak, Gpkg"
license = "MIT"
authors = ["Giti Adrescor"]

[[bin]]
name = "gvalli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
colored = "2.2"
crossterm = "0.27"
flate2 = "1.0"
regex = "1.10"
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.10"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
